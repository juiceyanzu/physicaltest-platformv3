
**Root Cause:** Connection pool settings were incorrectly reduced in configuration, causing pool exhaustion and high P99 latency (>2s) when normal traffic volumes exceeded the capacity.

**Evidence:**
- Log evidence: Pattern of connection timeouts in backend services (auth-service, database, user-service)
- Metric evidence: High connection pool saturation (>95%) and queue depth spikes around alert time
- Change evidence: Configuration reduced from pool size 100 to 50, timeouts from 5000ms to 2000ms, and backend pools halved

**Proposed Fix:**
- Type: Configuration patch (no code rollback required)
- Target: api-gateway.yaml configuration file
- Action: Restore connection pool settings to safe values with added circuit breaker resilience

**Fix Changes:**
- Connection pool size: 50 to 100 (restore capacity)
- Max wait time: 2000ms to 5000ms (prevent premature failures)
- Auth-service pool: 10 to 20 (restore backend capacity)
- User-service pool: 10 to 20 (restore backend capacity)
- Database pool: 15 to 30 (restore database capacity)
- Added circuit breaker patterns to prevent cascade failures

**Risk Assessment:**
- Probability of success: High (configuration changes are well-understood, reversible)
- Potential side effects: Increased resource utilization on downstream services during traffic spikes
- Recommended tests: Load testing with expected traffic patterns, connection pool health metrics verification, circuit breaker failover testing

**Next Steps:**
1. Create PR with the restored configuration
2. Deploy to staging environment for load testing
3. Monitor connection pool metrics (active/idle/max connections, queue depth)
4. Coordinate with backend services teams to investigate root cause
5. Implement circuit breaker configuration optimally based on environment constraints
