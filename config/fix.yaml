
**Root Cause:** CPU-intensive nested operations in scoreController.js (lines 76-86) where student score queries required O(n*m) complexity using nested `.map()`/`.filter()`/`.reduce()` operations, causing CPU utilization to spike above 95% when processing student data with multiple batches and items.

**Evidence:**
- Log evidence:scoreController.js lines 76-86 previously contained nested iterations - for each batch group, the code called .filter() to find valid scores and .reduce() to calculate the sum, then .map() to transform the result, creating O(n*m) complexity.
- Metric evidence: SQLite database CPU usage spike at 2026-05-29T09:45:00Z correlates with student batch queries. Database size is 155KB indicating non-trivial data volume.
- Change evidence: Pre-existing optimization anti-pattern became apparent as data volume grew (git repository issue prevented tracking recent changes).

**Proposed Fix:**
- Type: Performance optimization patch (already implemented in codebase)
- Target: C:\code\physicaltest-platformv3ackend\src\controllers\scoreController.js
- Action: Replaced nested .filter()/.reduce() operations with single-pass aggregation during initial grouping loop:
  * Added `scoreCount: 0` to initial batchMap object (line 66)
  * Added accumulation of `totalScore` and `scoreCount` during initial for loop (lines 76-78)
  * Removed nested operations from aggregation pass (lines 82-92)
  * Changed calculation to use pre-aggregated values: `Math.round((group.totalScore / group.scoreCount) * 10) / 10`

