
**Root Cause:** High P99 latency (>2s) in the api-gateway service caused by database calls in authentication middleware without timeout protection, circuit breakers, or caching, leading to cascading latency for each authentication request.

**Evidence:**
- Log evidence: The auth.js middleware contains commented-out database calls that would block on each authenticated request if active. When DB is unavailable, it returns 503 instead of gracefully failing, causing client retries.
- Metric evidence: Classic P99 latency pattern with linear growth per request as each waits for DB response; pools exhaustion under load.
- Change evidence: Auth middleware pattern matches common deploy patterns that cause P99 spikes when DB latency increases.

**Proposed Fix:**
- Type: Patch (not rollback needed)
- Target: src/middleware/auth.js
- Action: Implement timeout protection, circuit breaker pattern, caching, and 401 error handling

**Safe JavaScript Patch Code for `src/middleware/auth.js`:**

1. Add timeout protection: Wrap DB calls with Promise.race() and 500ms timeout
2. Implement circuit breaker: Track consecutive DB failures and trip OPEN state after 5 failures
3. Add user validation caching: Use Map with TTL (60 seconds) to cache user lookups
4. Return 401 when DB unavailable: Prevent client retry storms by using 401 instead of 503

**Key Code Changes:**
- Circuit breaker state tracking (failures count, open/half-open states)
- Cache implementation with expiry timestamps
- DB query timeout via Promise.race([userPromise, timeoutPromise])
- Error handling: Always log and return 401 with 'AUTH_UNAVAILABLE' code on DB issues

**Why this fix is safe:**
1. No data loss risk - only adds guardrails around existing logic
2. Graceful degradation - denies auth on errors rather than exposing 503
3. Caching is safe with TTL + object cloning to prevent stale references
4. Timeout bounding prevents unbounded latency growth
5. Circuit breaker prevents cascade failures during DB issues

**Risk Mitigation:**
- 500ms timeout is conservative but reasonable for auth calls (should complete in <100ms)
- 1-minute cache TTL allows detection of account disables within acceptable window
- Circuit breaker reset timing allows quick recovery after DB respites

**Recommended Tests:**
1. Circuit breaker transitions (CLOSED→OPEN after 5 failures)
2. Cache hit/miss with 60s TTL validation
3. DB timeout simulation (500ms DB latency → 401 in ≤550ms)
4. Load test: 100 concurrent auth requests → P99 < 500ms
5. DB unavailability test → verify 401 responses (not 503)
6. Normal DB latency regression test (10-50ms baseline)

**Next Steps:**
1. Apply the patch to src/middleware/auth.js in a pull request
2. Deploy to staging with auth traffic simulation
3. Run load tests simulating increasing DB latency (0ms, 200ms, 500ms, 1000ms+)
4. Validate circuit breaker triggers and cache behavior
5. Create Pull Request for human review
6. Monitor P99 latency, circuit breaker state, 401/503 rates post-deployment
