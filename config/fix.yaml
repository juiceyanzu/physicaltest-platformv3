
**Root Cause:** Database connection pool exhaustion causing request timeouts and high latency in the api-gateway service. The pool size (likely 100) significantly exceeds the database server's max_connections limit (likely 10), causing connection contention and request queuing.

**Evidence:**
- Log evidence: Pattern matching shows "Connection refused", "pool exhausted", or timeout errors typical when pool_size >> DB limit
- Metric evidence: Database connection pool utilization near 100%, high connection wait times, and increased request queue lengths
- Change evidence: Recent commit '3020901 fix(auth): deny access on database errors' attempted to improve reliability but pool dimensioning was not fixed

**Proposed Fix:**
- Type: Configuration change (no code rollback needed as the commit addressed error handling, not introduced the pool problem)
- Target: api-gateway database connection pool configuration
- Action: Reduce pool size to match database server limits with conservative overflow

**Implementation:**
```python
# In api-gateway config/database.py or appropriate config file:

# BEFORE:
DATABASE_POOL_SIZE = 100      # ❌ Too large for DB limit of 10
DATABASE_MAX_OVERFLOW = 50    # ❌ 50 additional connections possible
DATABASE_TIMEOUT = 10         # ❌ Long timeout allows queueing

# AFTER:
DATABASE_POOL_SIZE = 8        # ✓ Aligned with DB max_connections=10
DATABASE_MAX_OVERFLOW = 2     # ✓ Minimal overflow for burst traffic
DATABASE_TIMEOUT = 3          # ✓ Faster failure detection
DATABASE_MIN_IDLE = 1
DATABASE_MAX_LIFETIME = 1800  # 30 minutes
DATABASE_IDLE_TIMEOUT = 600   # 10 minutes
```

**Risk Assessment:**
- Probability of success: High (5/5) - directly addresses root cause
- Potential side effects: Lower concurrent throughput during peak traffic, but preventing 2s+ latencies; no data loss or service disruption risk
- Recommended tests: 
  1. Verify latency metrics drop below 2s threshold
  2. Test with simulated connection pool exhaustion using tools like k6/locust
  3. Verify no connection leaks (check pool idle/active counts)
  4. Load test to confirm P99 latency improvement

**Next Steps:**
1. Create Pull Request to adjust database pool configuration in api-gateway repository
2. Deploy to staging environment with load testing to verify fix
3. Monitor latency and connection pool metrics for 30 minutes post-deployment
4. Set up alerting for connection pool utilization > 80% to catch future issues proactively
