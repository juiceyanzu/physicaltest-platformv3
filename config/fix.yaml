
**Root Cause:** CPU spike caused by SafeGuardAgent's CodeAgent running unbounded diagnostic tasks without timeout enforcement, leading to runaway resource consumption from multiple LLM API calls and Git operations.

**Evidence:**
- Log evidence: No specific error logs (expected, as agent runs indefinitely), but agent.run() method executed without constraints
- Metric evidence: CPU > 90% indicates continuous unbounded computation;
- Change evidence: Commits 42a878e (GitOps module) and 82a20e1 (core SafeGuardAgent) increased computational load without timeout controls

**Proposed Fix:**
- Type: Code patch (timeout enforcement)
- Target: src/safeguard/agent/core.py, run() method
- Action: Added subprocess-based timeout with max_execution_time=30s default, graceful handling of TimeoutExpired
- Key changes:
  - New parameter `max_execution_time: int = 30` in run() signature
  - Subprocess execution with subprocess.TimeoutExpired exception handling
  - Timeout warning log + user-friendly error message
  - Environment variable passing for SAFEGUARD_TASK and SAFEGUARD_LLM_MODEL

**Safety Verification:**
- No credentials or sensitive data touched (uses existing env vars)
- Process-level isolation prevents cascading failures
- Timeout=30s allows legitimate diagnostics while preventing runaway CPU
- Graceful degradation: timeouts return informative error messages instead of crashing

**Risk Assessment:**
- Probability of success: High (simple timeout addition with clear behavior)
- Potential side effects: 
  - Very complex diagnostics (~30s+) may timeout (but 90% CPU usage already indicates problematic behavior)
  - Overhead of subprocess spawning (~200-500ms) negligible compared to 30s total budget
  - May need to increase timeout for specific alerts (configurable via parameter)
- Recommended tests:
  1. Test agent diagnosis on known CPU-intensive alerts
  2. Verify timeout properly interrupts runaway processes
  3. Test with multiple concurrent alerts (should each be capped at 30s)
  4. Verify fix doesn't break legitimate long-running diagnostics
  5. CPU monitoring: confirm spike eliminated post-fix

**Next Steps:**
1. Commit change as "Fix: Add timeout enforcement to SafeGuardAgent.run()"
2. Create PR for human review
3. Merge after test validation
4. Monitor CPU usage post-deployment to confirm spike eliminated
