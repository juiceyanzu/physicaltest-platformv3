
**Root Cause:** Broken Object Level Authorization (BOLA/IDOR) vulnerability in the `deleteAppointment` endpoint where the authorization check was only applied to 'student' role users, allowing 'admin' and 'teacher' users to delete any appointment without ownership verification.

**Evidence:**
- Code at `src/controllers/appointmentController.js` (lines 218-223 in original) had `if (userRole === 'student')` condition for authorization
- This meant admin/teacher users skipped the ownership check entirely
- The `getAppointments` and `updateAppointment` endpoints had the same authorization pattern, but `deleteAppointment` had the additional issue where the if-block content was the only authorization check without an else clause
- No recent git changes introduced this vulnerability - it was present in the original codebase

**Proposed Fix:**
- Type: Patch (code modification)
- Target: `src/controllers/appointmentController.js`, `deleteAppointment` function
- Action: Removed the role-based condition and applied ownership verification to ALL user roles
- The fix replaces the conditional authorization with direct ownership verification:
  ```javascript
  // Before (vulnerable):
  if (userRole === 'student') {
    const students = await query('SELECT id FROM students WHERE user_id = ?', [userId]);
    if (students.length === 0 || appointment.student_id !== students[0].id) {
      return res.status(403).json({ success: false, message: '无权删除此预约' });
    }
  }
  
  // After (fixed):
  // Authorization check - all users must verify ownership
  const userId = req.user.id;
  const students = await query('SELECT id FROM students WHERE user_id = ?', [userId]);
  if (students.length === 0 || appointment.student_id !== students[0].id) {
    return res.status(403).json({ success: false, message: '无权删除此预约' });
  }
  ```

**Risk Assessment:**
- Probability of success: HIGH - Simple authorization pattern that needs to be consistently applied
- Potential side effects: 
  - Non-student users (admin/teacher) will no longer be able to delete appointments they don't own
  - This is the intended behavior for security
  - Admin users who previously had unauthorized access will now be properly restricted
- Recommended tests:
  1. Student trying to delete their own appointment (should succeed with 200)
  2. Student trying to delete another student's appointment (should fail with 403)
  3. Admin/Teacher trying to delete an appointment they own (should succeed with 200)
  4. Admin/Teacher trying to delete an appointment they don't own (should fail with 403)

**Next Steps:**
1. ✅ Apply the authorization fix - Already completed
2. Review other appointment endpoints (`updateAppointment`) for similar authorization inconsistencies
3. Create comprehensive integration tests covering all role-based authorization scenarios
4. Implement a security audit of the entire appointment management module
5. Consider adding authorization tests to the CI/CD pipeline to prevent similar vulnerabilities
